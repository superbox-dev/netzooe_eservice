[build-system]
requires = [
    "setuptools>=82.0.1,<84.1.0",
]
build-backend = "setuptools.build_meta"

[project]
name = "netzooe_eservice"
description = "A Home Assistant integration to read energy data from the Netz OÖ eService portal"
readme = "README.md"
authors = [
    { name = "Michael Hacker", email = "mh@superbox.one" },
]
maintainers = [
    { name = "Michael Hacker", email = "mh@superbox.one" },
]
license-files = [
    "LICENSE"
]
keywords = [
    "component",
    "custom component",
    "custom integration",
    "hacs-component",
    "hacs-integration",
    "hacs-repository",
    "hacs",
    "hass",
    "home assistant",
    "home-assistant",
    "homeassistant",
    "integration",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
requires-python = ">= 3.14.2"
dependencies = [
    "netzooe_eservice_api~=1.1.0",
    "homeassistant>=2026.2.3",
    "requests>=2.32.5"
]
version = "1.1.0b1"

[project.urls]
"Repository" = "https://github.com/superbox-dev/netzooe_eservice"
"Issues" = "https://github.com/superbox-dev/netzooe_eservice/issues"

[dependency-groups]
dev = [
    { include-group = "lint" },
    { include-group = "test" },
]
lint = [
    "black>=26.3.1",
    "mypy>=1.17.1",
    "prek>=0.4.13",
    "ruff>=0.15.10",
    "rumdl>=0.0.120",
    "types-PyYAML>=6.0.12.20250809",
    "yamllint>=1.37.1",
]
test = [
    "coverage>=7.10.0",
    "genbadge[coverage]>=1.1.2",
    "pytest>=9.0.3",
    "pytest-homeassistant-custom-component>=0.13.325",
]

[tool.setuptools]
packages = []
